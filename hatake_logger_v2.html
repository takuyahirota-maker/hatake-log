<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="畑ログ">
<title>畑作業ログ</title>
<style>
:root {
  --green: #1D9E75;
  --green-light: #E1F5EE;
  --green-dark: #0F6E56;
  --text: #1a1a18;
  --text-sub: #5a5a56;
  --text-hint: #9a9a94;
  --border: rgba(0,0,0,0.1);
  --border-med: rgba(0,0,0,0.18);
  --bg: #F7F4EE;
  --surface: #ffffff;
  --danger-bg: #fff0f0;
  --danger: #c0392b;
  --radius: 14px;
  --radius-sm: 9px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 14px 20px 12px; position: sticky; top: 0; z-index: 10; }
.header-inner { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; background: var(--green); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
.header-text h1 { font-size: 17px; font-weight: 600; color: var(--text); }
.header-text p { font-size: 12px; color: var(--text-sub); margin-top: 1px; }

.main { padding: 16px; max-width: 480px; margin: 0 auto; }

.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.card-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 10px; }

input[type="password"], input[type="text"] {
  width: 100%; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 14px; color: var(--text); background: var(--bg);
  font-family: inherit;
}
input:focus { outline: none; border-color: var(--green); }

.memo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; min-height: 40px; }
.memo-item { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; color: var(--text); line-height: 1.6; display: flex; gap: 8px; align-items: flex-start; }
.memo-item-num { font-size: 11px; color: var(--text-hint); font-weight: 600; padding-top: 2px; flex-shrink: 0; }
.memo-empty { font-size: 13px; color: var(--text-hint); text-align: center; padding: 10px 0; }

.rec-btn {
  width: 100%; padding: 18px 16px;
  background: var(--surface); border: 0.5px solid var(--border-med);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center; gap: 12px;
  font-size: 16px; font-weight: 500; color: var(--text); cursor: pointer;
  transition: background 0.15s; -webkit-appearance: none;
}
.rec-btn:active { background: #f0f0eb; }
.rec-btn.recording { background: var(--danger-bg); border-color: rgba(192,57,43,0.25); color: var(--danger); }
.rec-icon { font-size: 26px; line-height: 1; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s ease-in-out infinite; flex-shrink: 0; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.tip { font-size: 12px; color: var(--text-hint); margin-top: 8px; line-height: 1.6; display: flex; gap: 5px; }
.tip-icon { flex-shrink: 0; margin-top: 1px; }

.save-btn {
  width: 100%; padding: 15px; border: none; border-radius: var(--radius);
  background: var(--green); color: white; font-size: 16px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 12px; -webkit-appearance: none; transition: background 0.15s;
}
.save-btn:active { background: var(--green-dark); }
.save-btn:disabled { opacity: 0.5; }

.clear-btn {
  width: 100%; padding: 13px; background: var(--surface); border: 0.5px solid var(--border-med);
  border-radius: var(--radius); color: var(--text-sub); font-size: 14px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-appearance: none;
}
.clear-btn:active { background: #f0f0eb; }

.spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.35); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.result-section { display: none; margin-bottom: 14px; }
.result-header { font-size: 13px; color: var(--green-dark); font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 16px; margin-bottom: 10px; }
.field-row { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.field-row:last-child { border-bottom: none; }
.field-label { font-size: 12px; color: var(--text-sub); font-weight: 500; margin-bottom: 3px; }
.field-value { font-size: 14px; color: var(--text); line-height: 1.6; }
.field-empty { color: var(--text-hint); }

.history-section { margin-top: 24px; }
.history-title { font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 10px; }
.history-item { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px; }
.history-date { font-size: 11px; color: var(--text-hint); margin-bottom: 4px; }
.history-work { font-size: 13px; color: var(--text); line-height: 1.5; }
.history-empty { font-size: 13px; color: var(--text-hint); text-align: center; padding: 20px 0; }

.status-bar { background: var(--green-light); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: var(--green-dark); font-weight: 500; margin-bottom: 12px; display: none; align-items: center; gap: 8px; }
.status-bar.error { background: var(--danger-bg); color: var(--danger); }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a18; color: white; font-size: 13px; font-weight: 500; padding: 10px 20px; border-radius: 100px; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; z-index: 100; }
.toast.show { opacity: 1; }

.setup-note { font-size: 11px; color: var(--text-hint); margin-top: 6px; line-height: 1.5; }
.setup-note a { color: var(--green-dark); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🌱</div>
    <div class="header-text">
      <h1>畑作業ログ</h1>
      <p>声で記録、AIが整理してスプレッドシートに保存</p>
    </div>
  </div>
</header>

<div class="main">

  <!-- API KEY -->
  <div class="card" id="apiCard">
    <div class="card-label">🔑 Anthropic APIキー</div>
    <input type="password" id="apiKey" placeholder="sk-ant-..." oninput="saveSettings()" />
    <p class="setup-note">キーはこのデバイスのみに保存されます。<a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> で取得できます。</p>
  </div>

  <!-- 録音 -->
  <div class="card">
    <div class="card-label">🎙️ 音声メモ（作業中に何度でも録音できます）</div>
    <div class="memo-list" id="memoList">
      <div class="memo-empty" id="memoEmpty">まだメモがありません</div>
    </div>
    <button class="rec-btn" id="recBtn" onclick="toggleRec()">
      <span class="rec-icon" id="recIcon">🎤</span>
      <span id="recText">タップして録音開始</span>
    </button>
    <div class="tip">
      <span class="tip-icon">ℹ️</span>
      <span>録音→停止を繰り返して複数のメモを残せます。「トマト5本収穫」「葉に虫食い発見」など短く話してください。</span>
    </div>
  </div>

  <!-- ステータス -->
  <div class="status-bar" id="statusBar"></div>

  <!-- 整理して保存 -->
  <button class="save-btn" id="saveBtn" onclick="processAndSave()">
    ✨ AIで整理してスプレッドシートに保存
  </button>

  <!-- 結果 -->
  <div class="result-section" id="resultSection">
    <div class="result-header">✅ 整理完了・スプレッドシートに保存しました</div>
    <div class="result-card" id="resultCard"></div>
  </div>

  <!-- 次の記録へ -->
  <button class="clear-btn" id="clearBtn" onclick="clearAll()" style="display:none">
    🔄 次の記録へ
  </button>

  <!-- 履歴 -->
  <div class="history-section">
    <div class="history-title">最近の記録</div>
    <div id="historyList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxMtHZIP_WQLTsNwBd4yOmeoXy5enID80Uq-uSJH34qdWpZ98VsaV-eZTDU17EDiZk/exec';
const FIELDS = [
  { key: 'date', label: '📅 日付' },
  { key: 'weather', label: '🌤️ 天気・気温' },
  { key: 'work', label: '🌿 作業内容' },
  { key: 'harvest', label: '🧺 収穫' },
  { key: 'introduced', label: '🌱 導入した作物・農材' },
  { key: 'observation', label: '👁️ 観察・気づき' },
  { key: 'next_action', label: '➡️ 次回の課題' },
];

let memos = [];
let recognition = null;
let isRecording = false;
let toastTimer;

window.addEventListener('load', () => {
  const k = localStorage.getItem('hatake_key');
  if (k) document.getElementById('apiKey').value = k;
  renderHistory();
});

function saveSettings() {
  const k = document.getElementById('apiKey').value.trim();
  if (k) localStorage.setItem('hatake_key', k);
}

function toggleRec() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('音声認識未対応です（Chrome推奨）');
    return;
  }
  if (isRecording) {
    recognition && recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = false;

  const btn = document.getElementById('recBtn');
  const icon = document.getElementById('recIcon');
  const text = document.getElementById('recText');

  recognition.onstart = () => {
    isRecording = true;
    btn.classList.add('recording');
    icon.textContent = '⏹️';
    text.innerHTML = '<span style="display:flex;align-items:center;gap:8px"><span class="rec-dot"></span>録音中… タップして停止</span>';
  };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (transcript.trim()) {
      memos.push(transcript.trim());
      renderMemos();
    }
  };

  const stopRec = () => {
    isRecording = false;
    btn.classList.remove('recording');
    icon.textContent = '🎤';
    text.textContent = 'タップして録音開始';
  };

  recognition.onend = stopRec;
  recognition.onerror = stopRec;
  recognition.start();
}

function renderMemos() {
  const list = document.getElementById('memoList');
  const empty = document.getElementById('memoEmpty');
  if (memos.length === 0) {
    list.innerHTML = '<div class="memo-empty" id="memoEmpty">まだメモがありません</div>';
    return;
  }
  list.innerHTML = memos.map((m, i) =>
    `<div class="memo-item"><span class="memo-item-num">${i + 1}</span><span>${m}</span></div>`
  ).join('');
}

async function processAndSave() {
  if (memos.length === 0) { showToast('メモを録音してください'); return; }
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { showToast('APIキーを入力してください'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div><span>AIが整理中…</span>';
  showStatus('🤖 AIが内容を整理しています…');

  const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
  const combinedMemo = memos.join('。');

  let parsed;
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `農業作業記録を整理するAIです。以下のメモからJSONのみ返してください。前置き不要。

メモ：「${combinedMemo}」
今日：${today}

{"date":"YYYY/MM/DD","weather":"","work":"","harvest":"","introduced":"","observation":"","next_action":"","raw_memo":"${combinedMemo.replace(/"/g, '\\"')}"}`
        }]
      })
    });

    if (!resp.ok) throw new Error('APIエラー ' + resp.status);
    const data = await resp.json();
    const raw = data.content.map(c => c.text || '').join('');
    parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
  } catch (e) {
    showStatus('❌ AI処理エラー: ' + e.message, true);
    btn.disabled = false;
    btn.innerHTML = '✨ AIで整理してスプレッドシートに保存';
    return;
  }

  showStatus('📊 スプレッドシートに保存中…');

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(parsed)
    });
    showStatus('✅ スプレッドシートに保存しました！');
    showResult(parsed);
    saveHistory(parsed);
    document.getElementById('clearBtn').style.display = 'flex';
  } catch (e) {
    showStatus('❌ 保存エラー: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ AIで整理してスプレッドシートに保存';
  }
}

function showStatus(msg, isError = false) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar' + (isError ? ' error' : '');
  bar.style.display = 'flex';
}

function showResult(p) {
  const card = document.getElementById('resultCard');
  card.innerHTML = FIELDS.map(f =>
    `<div class="field-row">
      <div class="field-label">${f.label}</div>
      <div class="field-value ${p[f.key] ? '' : 'field-empty'}">${p[f.key] || '—'}</div>
    </div>`
  ).join('');
  document.getElementById('resultSection').style.display = 'block';
  document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearAll() {
  memos = [];
  renderMemos();
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveHistory(p) {
  const h = JSON.parse(localStorage.getItem('hatake_hist') || '[]');
  h.unshift({ date: p.date || new Date().toLocaleDateString('ja-JP'), work: p.work || '', ts: Date.now() });
  localStorage.setItem('hatake_hist', JSON.stringify(h.slice(0, 20)));
  renderHistory();
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('hatake_hist') || '[]');
  const el = document.getElementById('historyList');
  if (!h.length) { el.innerHTML = '<div class="history-empty">まだ記録がありません</div>'; return; }
  el.innerHTML = h.map(i =>
    `<div class="history-item">
      <div class="history-date">${i.date}</div>
      <div class="history-work">${i.work || '（記録あり）'}</div>
    </div>`
  ).join('');
}

let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
